<dialog #dialog>
  <div class="settings-header">
    <h2>Settings</h2>
    <button class="close-btn" (click)="close()">×</button>
  </div>

  <div class="settings-body">
    <h3>Custom Fields</h3>

    @if (sortedFields().length > 0) {
      <table class="fields-table">
        <thead>
          <tr>
            <th>Label</th>
            <th>Type</th>
            <th>Order</th>
            <th>Hidden</th>
          </tr>
        </thead>
        <tbody>
          @for (field of sortedFields(); track field.label) {
            <tr>
              <td>{{ field.label }}</td>
              <td>{{ field.type }}</td>
              <td>
                <input
                  type="number"
                  [value]="field.order"
                  (change)="updateOrder(field.label, $event)"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  [checked]="field.hidden"
                  (change)="updateHidden(field.label, $event)"
                />
              </td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="no-fields">No custom fields yet.</p>
    }

    <h3>Add Field</h3>
    <div class="add-field-form">
        <label for="label">Label:</label>
        <input type="text" [(ngModel)]="newLabel" name="label" />

        <label for="type">Type:</label>
        <select name="type" [(ngModel)]="newType">
          <option value="text">text</option>
          <option value="boolean">boolean</option>
          <option value="number">number</option>
        </select>
        @if (newType === 'number') {
        <label for="rangeMin">Range min:</label>
        <input type="number" name="rangeMin" [(ngModel)]="newRangeMin" />
        <label for="rangeMax">Range max:</label>
        <input type="number" name="rangeMax" [(ngModel)]="newRangeMax" />
        }
        <label for="order">Order:</label>
        <input type="number" name="order" [(ngModel)]="newOrder" />

        <button (click)="submitAddField()">Add Field</button>
      @if (addError()) {
        <p class="add-error">{{ addError() }}</p>
      }
    </div>
  </div>
</dialog>

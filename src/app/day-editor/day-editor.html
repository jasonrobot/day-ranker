<div class="day-container {{ scoreClass() }}">
  <div class="day-number">{{ dayNumber() }}</div>
  <form [formGroup]="form">
    <label>
      Score (-3 to +3):
      <input type="number" formControlName="score" min="-3" max="3" />
    </label>
    <label>
      Comment:
      <textarea class="comment-input" formControlName="comment" #commentInput></textarea>
    </label>
  </form>
</div>

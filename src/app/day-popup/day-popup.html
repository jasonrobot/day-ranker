<dialog #dialog>
  <div class="popup-header">
    <span class="popup-title">{{ monthName() }} {{ dayNumber() }}</span>
    <button class="close-btn" (click)="close()">×</button>
  </div>
  <div class="popup-body">
    <button class="nav-btn" (click)="prev()" [disabled]="!canGoPrev()" [style.visibility]="isDirty() ? 'hidden' : 'visible'">‹</button>
    <app-day-editor
      [dayNumber]="dayNumber()"
      [monthIndex]="monthIndex()"
      [dayIndex]="dayIndex()"
      (saved)="close()"
      (dirtyChange)="onDirtyChange($event)" />
    <button class="nav-btn" (click)="next()" [disabled]="!canGoNext()" [style.visibility]="isDirty() ? 'hidden' : 'visible'">›</button>
  </div>
  <div class="popup-footer">
    <button (click)="save()">Save</button>
    <button (click)="close()">Cancel</button>
  </div>
</dialog>
